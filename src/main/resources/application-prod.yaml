spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
security:
  jwt:
    secret: ${JWT_SECRET}
platform:
  bootstrap:
    enabled: ${PLATFORM_BOOTSTRAP_ENABLED:false}
billing:
  manual:
    enabled: false
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
server:
  error:
    include-message: never
    include-stacktrace: never
logging:
  level:
    root: INFO
