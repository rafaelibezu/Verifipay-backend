spring:
  application:
    name: verifipay-backend

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    validate-migration-naming: true

security:
  jwt:
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}

payment-request:
  expiration-minutes: ${PAYMENT_REQUEST_EXPIRATION_MINUTES:5}

server:
  port: ${SERVER_PORT:8080}
